<!DOCTYPE html>
<html lang="fa">


<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0,shrink-to-fit=no,viewport-fit=cover" />
    <title>[##cms.seo.title|( محاسبه تاریخ ساتراپ تراول)##]</title>
    <meta name="description" content="[##cms.seo.description|(شرکت خدمات مسافرت هوایی و گردشگری  ساتراپ تراول)##]" />
    <basis core="dbsource" source="hosting" name="tag" urlid="[##cms.seo.urlid##]">
        <member type="list" name="list" request="taglist" preview=""></member>
    </basis>
    <basis core="print" datamembername="tag.list">
        <face filter="key = 'canonical'">
            <link rel="canonical" href="@value" />
        </face>
        <face>
            <meta property="@key" content="@value" />
        </face>
    </basis>
    <basis core="call" file="pwa.inc" />
    <basis core="call" file="style.inc" />
    <link href="[##cms.cms.cdn##]/css/contact-us-form.css" type="text/css" rel="stylesheet" />
    <link rel="stylesheet" href="[##cms.cms.cdn##]/_css/swiper-bundle.min.css" />
</head>

<body class="   ">
    <basis core="call" file="header.inc"></basis>
    <main class=" relative bg-list-pattern-v2 bg-no-repeat bg-top bg-cover">

        <section class="  w-full   clear-both   h-[523px] p-14 pt-0  relative">
            <img src="[##cms.cms.cdn##]/images/date-change-banner.jpg" alt="/date-change-banner"
                class="z-0 left-0 top-0 absolute w-full h-full object-cover">
            <span class="w-full bg-[#0B1B4CCF] blur-4px h-full absolute top-0 left-0"></span>
            <div class="w-full flex flex-col gap-2 justify-center items-center pt-36px z-[2]">
                <h1 class="text-white  font-bold text-[48px]  text-center z-[2]">تبدیل تاریخ</h1>
                <h2 class="text-white text-base  font-bold   z-[2]">تبدیل تاریخ شمسی به میلادی و بالعکس
                </h2>
                <ul class="flex items-center gap-1 z-[2]">
                    <li>
                        <a href="/" class="text-white text-xs hover:text-primary">صفحه اصلی</a>
                    </li>
                    <li class="text-xs text-white">/</li>
                    <li class="text-xs text-white">تبدیل تاریخ</li>
                </ul>
            </div>
        </section>
        <div id="date-convertor" class="max-w-7xl mx-auto w-[95%] -mt-[21rem]  flex flex-col gap-7z-10 relative">
            <div class="flex justify-center gap-2 p-3 bg-white rounded-[50px] w-fit mx-auto change-date-btn-container">
                <label name="calendar-label"
                    class="flex cursor-pointer transition-all ease-in-out duration-300 justify-center items-center   h-11 rounded-[50px] bg-secondary w-[126px]   font-bold text-sm text-center  "><input
                        class="appearance-none hidden" type="radio" name="calendar" value="shamsi" checked
                        onclick="updateYears();updateMonths();">شمسی به میلادی</label>
                <label name="calendar-label"
                    class="flex justify-center items-center transition-all ease-in-out duration-300  h-11 rounded-[50px] bg-white w-[126px]   font-bold cursor-pointer text-sm text-center "><input
                        class="appearance-none hidden" type="radio" name="calendar" value="gregorian"
                        onclick="updateYears();updateMonths();">میلادی به شمسی</label>
            </div>
            <div class="w-fullmx-auto bg-white border-t-7px border-secondary-700 rounded-3xl relative  mt-8 drop-shadow-xl">


                <div class=" flex justify-between w-full px-5 py-5">
                    <div class="flex flex-col w-1/2 px-6">
                        <div class="py-3 flex justify-between items-center w-11/12 mx-auto"><label for="day"
                                class="  font-medium ml-3 text-lg  inline-block">روز</label><select
                                class="w-[215px] bg-zinc-100 h-[55px]  outline-none pl-4 border-none text-xs p-2 rounded-lg " id="day"
                                onchange="convert()"></select></div>

                        <div class="py-3 flex justify-between items-center w-11/12 mx-auto"><label for="month"
                                class="  font-medium ml-3 text-lg  inline-block">ماه</label>
                                <select
                                class="w-[215px] bg-zinc-100 h-[55px]  outline-none pl-4 border-none text-xs p-2 rounded-lg "
                                id="month" onchange="updateDays();convert()">
                            </select></div>

                        <div class="py-3 flex justify-between items-center w-11/12 mx-auto"><label for="year"
                                class="  font-medium ml-3 text-lg  inline-block">سال</label>
                            <select class="w-[215px] bg-zinc-100 h-[55px]  outline-none pl-4 border-none text-xs p-2 rounded-lg "
                                id="year" onchange="updateDays();convert()"></select>
                        </div>
                    </div>
                    <div id="result"
                        class="w-1/2   border-r pr-[40px] border-zinc-300   gap-y-6 flex flex-col justify-center items-center">
                    </div>
                </div>
            </div>
        </div>


        <section class="max-w-7xl mt-24 w-[95%] mx-auto flex justify-center relative">
            <div class="px-4 relative w-full h-full lg:px-4 xl:!w-[1280px] xl:!px-0 flex flex-col">
                <div class="flex relative items-center gap-3">
                    <div class="flex z-10 w-full relative bg-white  items-center gap-1">

                        <basis core="print" datamembername="db.aid-text">
                            <face filter="TypeID=150">
                                <p
                                    class="title-wrapper w-full flex items-center gap-3 relative p-4 bg-primary-50 font-bold text-2xl text-zinc-900 rounded-xl">
                                    @text
                                </p>

                            </face>
                        </basis>
                    </div>
                </div>
                <div class="flex  flex-col justify-center items-center mt-3 gap-8">
                    <div class="  flex flex-col gap-3 overflow-hidden w-full ">
                        <basis core="print" datamembername="db.aid-text">
                            <face filter="TypeID=129">
                                <div class="text-sm text-zinc-900 text-justify">@largetext</div>
                            </face>
                        </basis>


                        <basis core="print" datamembername="db.aid-text">
                            <face filter="TypeID=250">
                                <p
                                    class="title-wrapper w-full flex items-center gap-3 relative p-4 bg-primary-50 font-bold text-2xl text-zinc-900 rounded-xl">
                                    @text
                                </p>
                                <div class="text-sm text-zinc-900 text-justify">@largetext</div>

                            </face>
                        </basis>



                    </div>

                   

                </div>
            </div>
        </section>



        <section class="max-w-7xl w-[95%] mx-auto flex justify-center relative mt-12">
            <div
                class="px-4 relative after-to-bottom-border mb-16 w-full lg:px-4 xl:!w-[1280px] xl:!px-0 flex flex-col">
                <div class=" last-section-form relative w-full flex flex-col">
                    <div class="flex  items-center gap-3 ">
                        <div class="flex z-10 items-center px-2 gap-3 relative bg-white">
                            <img loading="lazy" src="[##cms.cms.cdn##]/images/logo-small.png" alt="small-logo"
                                class="w-8 h-8">
                            <p class="font-bold text-2xl text-zinc-900"> ارتباط با کارشناسان</p>
                            <span class="bullet-1"></span>
                        </div>
                    </div>
                    <div class="my-[50px] z-[4] items-center w-full flex">
                        <div
                            class="w-full rounded-2xl overflow-hidden relative flex items-center justify-center h-[143px] px-[35px] py-5">
                            <img loading="lazy" src="[##cms.cms.cdn##]/images/contact-form-image.jpg" alt="contact-us"
                                class="w-[42%] h-full z-0 absolute left-0 top-0">
                            <span
                                class="w-[80px] absolute left-[calc(42%-3px)] z-[3] bg-gradient-to-r from-[#d6d9d8] h-full"></span>
                            <span
                                class="w-full h-full rounded-2xl bg-gradient-to-r z-[1] from-[#fff0] to-[#F2F2F2] absolute top-0 left-0 "></span>
                            <div class="flex z-[5] w-full flex-col h-full justify-between">
                                <p class="">جهت مشاوره خرید تور با کارشناسان ما در ارتباط باشید</p>
                                <div class="flex items-center">
                                    <div id="contact-form-resize" class="w-full flex flex-col gap-3">
                                        <basis core="schema" run="atclient"
                                            schemaurl="/schema/domainform/45FC3D20-CDFB-455D-8499-BE9734C540D3/7F0B6A53-0EBB-4989-810C-014B112083E9/fa/ارتباط-با-کارشناسان"
                                            displaymode="new" button="[data-btn-uploadfooter]"
                                            resultsourceid="upload.datafooter" OnRendered="RenderFormFooter">
                                        </basis>
                                        <basis core="api" if="{##cms.uploadFooter.run|(false)##}" run="atclient"
                                            url="/schema/domainform/45FC3D20-CDFB-455D-8499-BE9734C540D3/fa/editobject"
                                            method="post"
                                            body="object_edit={##cms.uploadFooter.value##}&captcha={##cms.uploadFooter.captcha##}&captchaid={##cms.uploadFooter.captchaid##}"
                                            content-type="application/x-www-form-urlencoded" triggers="cms.uploadFooter"
                                            OnProcessed="OnProcessedEditObjectFooter">
                                        </basis>
                                        <basis core="callback" run="atclient" method="uploadDocumentFooter"
                                            triggers="upload.datafooter"></basis>
                                        <div class="captcha-button">
                                            <div id="captchaContainer"
                                                class="captchaContainerclass !w-full captcha-sefaresh ml-2.5 max-xl:ml-0 max-xl:mb-[20px]"
                                                data-bc-answer-container data-bc-schema-info-multi="0"
                                                data-bc-schema-info-word="58" data-bc-schema-info-part="1"
                                                data-bc-schema-info-part-0-type="text">
                                                <basis core="dbsource" source="trust_login" name="captcha"
                                                    run="atclient" triggers="captcha.refreshFooter">
                                                    <member name="code" type="scalar" request="captcha"></member>
                                                </basis>
                                                <basis datamembername="captcha.code" core="print" run="atclient"
                                                    OnRendered="captchaRenderedFooter">
                                                    <face>
                                                        <script type="text/template">
         <div class="flex  justify-between ">
          
          <div class="flex sfvgwdcsdhc w-full items-center">

       <div class="float-right captcha-ctz w-1/2 relative">
         
       <input id="captcha-ct" type="text" class="contactUsInput codeinputm bg-white rounded-2xl p-3" name="captcha" maxlength="4" placeholder="کد امنیتی "/>
       <input type="hidden" name="captchaid" value="@captcha@" />
      </div>
       <div class="float-right w-1/2 justify-between lg:mt-0 bvgvkek h-fit leading-[65px] px-4 flex items-center gap-2">
        <img loading="lazy" src="/@captcha@" width="86" height="59" alt="captcha" />
      <span  onclick="refreshCaptchaFooter()">
       <svg class="group cursor-pointer" width="48" height="49" viewBox="0 0 48 49"
           fill="none" xmlns="http://www.w3.org/2000/svg">
           <path class="group-hover:stroke-primary"
            d="M25.7857 18.5L26.5807 20.5021C25.8273 20.0776 24.9442 19.8333 24 19.8333C21.2386 19.8333 19 21.9227 19 24.5C19 24.9149 19.058 25.3171 19.1669 25.7M22.2143 30.5L21.4193 28.4978C22.1727 28.9224 23.0558 29.1667 24 29.1667C26.7614 29.1667 29 27.0773 29 24.5C29 24.0851 28.942 23.6829 28.8331 23.3"
            stroke="#020121" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round" />
           <circle
            class="group-hover:stroke-primary transition-all duration-300 ease-in-out"
            cx="24" cy="24.5" r="10" stroke="#020121" stroke-width="1.5" />
          </svg>
      </span>
        
     </div>

              </div></div>
     </script>
                                                    </face>
                                                </basis>
                                                <button type="button" data-btn-uploadfooter
                                                    class="  data-body-btn w-[108px] h-[59px] flex justify-center items-center bg-secondary-600 rounded-lg hover:shadow-lg hover:bg-gradient-to-br hover:from-primary hover:to-primary-50">
                                                    ارسال
                                                </button>

                                            </div>

                                            <div
                                                class="Loading_Form hidden data-body-btn w-[126px] h-12 px-4 py-2 rounded-2xl justify-center items-center gap-2.5 flex">
                                                <div id="ballsWaveG"
                                                    class="ext-zinc-50 text-base font-normal leading-normal">
                                                    <div id="ballsWaveG_1" class="ballsWaveG"></div>
                                                    <div id="ballsWaveG_2" class="ballsWaveG"></div>
                                                    <div id="ballsWaveG_3" class="ballsWaveG"></div>
                                                    <div id="ballsWaveG_4" class="ballsWaveG"></div>
                                                    <div id="ballsWaveG_5" class="ballsWaveG"></div>
                                                    <div id="ballsWaveG_6" class="ballsWaveG"></div>
                                                    <div id="ballsWaveG_7" class="ballsWaveG"></div>
                                                    <div id="ballsWaveG_8" class="ballsWaveG"></div>
                                                </div>
                                            </div>
                                            <div class="message-api absolute text-center text-primary text-xs"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>


    </main>
    <basis core="call" file="footer.inc"></basis>
