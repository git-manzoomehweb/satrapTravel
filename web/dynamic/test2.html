<face>
  <div class="tourL-tour-card swiper-slide group relative  !h-[109px] !w-full ">

    <span class="tourL-tour-airline hidden"
      data-airline-img="\@list.airline.pic">@db.last-minute-offer.prp_10000504</span>

    <div
      class="w-[747px] h-[95px] group-hover:bg-primary bg-zinc-100 rounded-2xl p-2 !flex justify-between items-center">
      <span content="@db.last-minute-offer.prp_3088134"
        class="text-white text-xs  bg-[#ff4949c5] absolute -top-3 right-4  px-4 line-clamp-1 h-8 flex justify-center items-center">@db.last-minute-offer.prp_3088134</span>
      <div class="w-full z-[2] h-[79px] bg-white rounded-xl !flex justify-between items-center py-4 px-[9px]">
        <a href="@db.last-minute-offer.link	" class="font-bold w-[217px] text-zinc-900 line-clamp-1">
          @db.last-minute-offer.title
        </a>
        <a href="@db.last-minute-offer.link" class="flex h-full justify-between flex-col gap-2 ">
          <div class="flex items-center   text-xs text-zinc-900 gap-2 line-clamp-1">
            <img loading="lazy" src="[##cms.cms.cdn##]/images/Time Circle.svg" alt="time circle">
            <span class="w-[120px] line-clamp-1">@db.last-minute-offer.prp_8076 </span>
          </div>
          <div class="flex items-center   text-xs text-zinc-900 gap-2 line-clamp-1">
            <img loading="lazy" src="[##cms.cms.cdn##]/images/Calendar.svg" alt="Calendar">
            <span class="line-clamp-1 w-[120px]">@db.last-minute-offer.prp_8077 </span>
          </div>
        </a>
        <a href="@db.last-minute-offer.link" class="flex h-full   flex-col  ">
          <div class="flex items-center gap-2">
            <img loading="lazy" src="[##cms.cms.cdn##]/images/plane up.svg" alt="planeup">
            <span class="text-xs text-zinc-900">ایرلاین </span>
          </div>
          <img loading="lazy" src="@list.airline.pic" alt="@list.airline.name	" class="w-[77px]">
        </a>
        <a href="@db.last-minute-offer.link" class="flex h-full justify-between  flex-col gap-2 ">
          <div class="flex items-center   text-xs text-zinc-900 gap-2 line-clamp-1">

            <span class=" line-clamp-1">شروع قیمت:</span>
          </div>
          <div class="flex items-center   text-xs text-zinc-900 gap-2 line-clamp-1">

            <span class="line-clamp-1 font-medium text-sm tourL-tour-price">@db.last-minute-offer.prp_8181 </span>
          </div>
        </a>
        <button onclick="toggleTourDateMenu(this, '@db.last-minute-offer.id')" type="button"
          class="tourL-tour-date-btn  date-btn flex justify-center items-center">تاریخ برگذاری</button>
      </div>


    </div>

  </div>
</face>
