<basis core="dbsource" source="media" name="gallery" lid="1" mid="15" mainid="[##cms.query.catid##]">
    <member type="view" name="details" />
</basis>


<div class="swiper-slide  relative !h-full px-5 bg-[#0000009a] rounded-xl !flex  justify-center items-center">
    <basis core="list" datamembername="gallery.details">
        <face filter="Question in('نام عکس')">
            <div class="px-5 w-full z-20 absolute top-0 left-0">
                <div
                    class=" w-full mt-3  py-3 bg-white shadow-2xl rounded-xl flex justify-center items-center text-clip font-bold text-2xl ">
                    @text</div>
            </div>
        </face>
    </basis>

    <basis core="list" datamembername="gallery.details">
        <face filter="text in('link2')">
            <a href="@largetext" target="_blank"
                class="  px-14 z-20 py-3 mb-5 rounded-lg text-xl font-bold bg-white before-line absolute bottom-0">مشاهده
                مطلب</a>
        </face>
    </basis>

    <basis core="list" datamembername="gallery.details">
        <face filter="text in('link1')">
            <div class="!rounded-lg  story-item  " data-video="@largetext">
                <img src="[##cms.cms.cdn##]/images/@largetext" alt="@largetext" class="rounded-lg w-full h-full object-cover absolute top-0 left-0">
            </div>
        </face>
    </basis>
    <div class="h-[700px]"></div>



</div>
