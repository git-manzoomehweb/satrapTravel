<basis core="dbsource" source="media" name="gallery" lid="1" mid="15" mainid="[##cms.query.catid##]">
    <member type="view" name="details" />
</basis>


<div class="swiper-slide  relative !h-full  bg-[#0000009a] rounded-xl !flex  justify-center items-center">


    <basis core="list" datamembername="gallery.details">
        <face filter="text in('link2')">
            <a href="@largetext" class="z-20 w-full h-full top-0 left-0">
            </a>
        </face>
    </basis>

    <basis core="list" datamembername="gallery.details">
        <face filter="text in('link1')">
            <div class="!rounded-lg  story-item  " data-video="@largetext">
                <img src="[##cms.cms.cdn##]/images/@largetext" alt="@largetext"
                    class="rounded-lg w-full h-full absolute top-0 left-0">
            </div>
        </face>
    </basis>
    <div class="h-[700px]"></div>



</div>
