<!DOCTYPE html>
<html lang="fa">


<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0,shrink-to-fit=no,viewport-fit=cover" />
    <title>[##cms.seo.title|(محاسبه تاریخ ساتراپ تراول)##]</title>
    <meta name="description" content="[##cms.seo.description|(شرکت خدمات مسافرت هوایی و گردشگری  ساتراپ تراول)##]" />
    <basis core="dbsource" source="hosting" name="tag" urlid="[##cms.seo.urlid##]">
        <member type="list" name="list" request="taglist" preview=""></member>
    </basis>
    <basis core="print" datamembername="tag.list">
        <face filter="key = 'canonical'">
            <link rel="canonical" href="@value" />
        </face>
        <face>
            <meta property="@key" content="@value" />
        </face>
    </basis>
    <basis core="call" file="pwa.inc" pageindex="[##cms.cms.pageindex##]" />
    <basis core="call" file="style.inc" pageindex="[##cms.cms.pageindex##]" />
    <link href="[##cms.cms.cdn##]/css/contact-us-form-mob.css" type="text/css" rel="stylesheet" />
    <link rel="stylesheet" href="[##cms.cms.cdn##]/_css/swiper-bundle.min.css" />
</head>

<body class="">
    <basis core="call" file="header.inc" pageindex="[##cms.cms.pageindex##]"></basis>
    <main class="w-full  mx-auto relative">

        <section class=" w-full relative  mx-auto clear-both h-[496px]">
            <img src="[##cms.cms.cdn##]/images/date-change-banner.jpg" alt="date-change-banner"
                class="z-0 left-0 top-0 absolute w-full h-full object-cover">
            <span class="w-full bg-[#0B1B4CCF] blur-4px h-full absolute top-0 left-0"></span>
            <div class="w-full relative flex flex-col gap-2 py-12 items-center z-10 justify-center">
                <h1 class="text-white text-center font-bold text-base ">تبدیل تاریخ</h1>
                <h2 class="text-white  text-center text-xs ">
                    تبدیل تاریخ شمسی به میلادی و بالعکس
                </h2>
                <ul class="flex items-center gap-1 z-[2]">
                    <li>
                        <a href="/" class="text-white text-xs hover:text-primary">صفحه اصلی</a>
                    </li>
                    <li class="text-xs text-white">/</li>
                    <li class="text-xs text-white">تبدیل تاریخ</li>
                </ul>
            </div>
        </section>
        <div id="date-convertor" class="w-full px-4  mx-auto   -mt-[18rem]">
            <div class="flex w-full bg-white  rounded-[50px] p-3 gap-1 relative z-10 justify-center mb-12 items-center">

                <label name="calendar-label"
                    class="flex cursor-pointer change-date-l justify-center transition-all ease-in-out duration-300 items-center h-[53px] rounded-[50px] bg-secondary w-1/2  font-medium text-sm  text-center text-white "><input
                        class="appearance-none hidden" type="radio" name="calendar" value="shamsi" checked
                        onclick="updateYears();updateMonths();">شمسی به میلادی</label>

                <label name="calendar-label"
                    class="flex justify-center change-date-l  items-center h-[53px] transition-all ease-in-out duration-300 text-sm rounded-[50px] bg-white w-1/2  font-medium cursor-pointer   text-center "><input
                        class="appearance-none hidden" type="radio" name="calendar" value="gregorian"
                        onclick="updateYears();updateMonths();">میلادی به شمسی</label>
            </div>
            <div class="max-w-[946px] mx-auto bg-white rounded-3xl border-t-7 border-secondary drop-shadow-xl">
                <div class=" flex justify-between flex-col-reverse w-full px-4  mx-auto gap-3 py-4">
                    <div class="flex flex-col w-full">
                        <div class="py-3 flex justify-between items-center w-11/12 mx-auto"><label for="day"
                                class="  text-base text-primary-900 ml-3 inline-block">روز</label><select
                                class="border w-[170px]  border-zinc-200 bg-white   outline-none    text-xs p-2 rounded-lg "
                                id="day" onchange="convert()"></select></div>
                         
                        <div class="py-3 flex justify-between items-center w-11/12 mx-auto"><label for="month"
                                class="  text-base text-primary-900 ml-3 inline-block">ماه</label><select
                                class="border w-[170px]  border-zinc-200 bg-white   outline-none    text-xs p-2 rounded-lg "
                                id="month" onchange="updateDays();convert()"></select></div>
                         
                        <div class="py-3 flex justify-between items-center w-11/12 mx-auto"><label for="year"
                                class="  text-base text-primary-900 ml-3 inline-block">سال</label><select
                                class="border w-[170px]  border-zinc-200 bg-white   outline-none    text-xs p-2 rounded-lg "
                                id="year" onchange="updateDays();convert()"></select></div>
                    </div>
                    <div id="result"
                        class="w-full gap-y-6 flex flex-col justify-center items-center">
                    </div>
                </div>
            </div>
        </div>


        <section class="w-full flex px-4 justify-center relative mt-12">
            <div class=" relative w-full h-full   flex flex-col">
                <div class="flex relative items-center gap-3">
                    <div class="flex z-10 relative bg-white px-2 items-center gap-1">

                        <basis core="print" datamembername="db.aid-text">
                            <face filter="TypeID=150">
                                <p class="font-bold text-base text-zinc-900"> @text </p>

                            </face>
                        </basis>
                    </div>
                </div>
                <div class="flex  flex-col justify-center items-center my-[50px] gap-8">
                    <div class="max-h-[500px] aid-content  flex flex-col gap-3 overflow-hidden w-full ">
                        <basis core="print" datamembername="db.aid-text">
                            <face filter="TypeID=129">
                                <div class="text-xs text-zinc-900 text-justify">@largetext</div>
                            </face>
                        </basis>


                        <basis core="print" datamembername="db.aid-text">
                            <face filter="TypeID=250">
                                <p
                                    class="title-wrapper w-full flex items-center gap-3 relative p-2 bg-primary-50 font-bold text-vase text-zinc-900 rounded-xl">
                                    @text
                                </p>
                                <div class="text-xs text-zinc-900 text-justify">@largetext</div>

                            </face>
                        </basis>



                    </div>

                    <basis core="print" datamembername="db.aid-text">
                        <layout>
                            <button type="button" aria-label="see-more"
                                class="flex hover:text-secondary-900 group text-primary-600 items-center gap-3"
                                id="see-more">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M11.9972 19C8.27467 19 4.93239 16.4801 3.0568 12.2638C3.01933 12.1804 3 12.0905 3 11.9996C3 11.9086 3.01933 11.8187 3.0568 11.7353C4.93424 7.51815 8.27652 5 11.9982 5C15.7198 5 19.0658 7.51815 20.9432 11.7353C20.9807 11.8187 21 11.9086 21 11.9996C21 12.0905 20.9807 12.1804 20.9432 12.2638C19.0667 16.4801 15.7244 18.9973 12.0028 19H11.9972ZM4.44503 12C6.11201 15.5513 8.91802 17.662 11.9954 17.6629C15.0728 17.6638 17.8778 15.5513 19.5457 12C17.8769 8.44785 15.0709 6.33707 11.9935 6.33707C8.91617 6.33707 6.1148 8.44785 4.44689 12H4.44503Z"
                                        fill="#049AEE" class="group-hover:fill-secondary-900" />
                                    <path
                                        d="M11.9973 15.4146C11.2988 15.4146 10.616 15.2146 10.0352 14.8398C9.45445 14.465 9.00182 13.9323 8.73456 13.3091C8.46729 12.6859 8.39741 12.0001 8.53374 11.3385C8.67008 10.6769 9.00652 10.0693 9.5005 9.59232C9.99448 9.1154 10.6238 8.79066 11.3089 8.65917C11.994 8.52768 12.7041 8.59534 13.3494 8.8536C13.9947 9.11186 14.5462 9.54912 14.9341 10.1101C15.322 10.6711 15.529 11.3305 15.5288 12.0051C15.5274 12.9091 15.1548 13.7756 14.4928 14.4147C13.8308 15.0539 12.9334 15.4134 11.9973 15.4146ZM11.9973 9.93081C11.5727 9.93081 11.1577 10.0524 10.8046 10.2802C10.4516 10.508 10.1764 10.8318 10.0139 11.2106C9.85135 11.5894 9.80878 12.0062 9.89155 12.4084C9.97432 12.8105 10.1787 13.18 10.4789 13.47C10.779 13.76 11.1615 13.9575 11.5779 14.0376C11.9943 14.1177 12.426 14.0768 12.8183 13.92C13.2106 13.7632 13.546 13.4976 13.782 13.1567C14.018 12.8159 14.1441 12.4151 14.1443 12.0051C14.1435 11.4553 13.9171 10.9283 13.5147 10.5395C13.1122 10.1507 12.5666 9.93176 11.9973 9.93081Z"
                                        fill="#049AEE" class="group-hover:fill-secondary-900" />
                                </svg>
                                <span class="text-xs"> مشاهده بیشتر</span>
                            </button>
                        </layout>
                    </basis>

                </div>
            </div>
        </section>



        <section class="w-full mb-8 px-4">
            <div
                class="w-full flex flex-col justify-end relative  overflow-hidden  bg-gradient-to-t from-[#F2F2F2]   to-[#FFFFFF00] rounded-2xl ">
                <figure class="h-[50%] z-0 w-full rounded-t-2xl">
                    <img loading="lazy" class="image-fade w-full h-full object-cover  rounded-t-2xl"
                        src="[##cms.cms.cdn##]/images/contact-image-mob.jpg" alt="contact-us">
                </figure>
                <div class="relative z-[2] pb-3 px-3 w-full flex flex-col gap-1">
                    <p class="font-bold text-sm leading-6">جهت مشاوره خرید تور با کارشناسان ما در ارتباط باشید</p>

                    <div id="contact-form-resize" class="w-full flex flex-col gap-3">
                        <basis core="schema" run="atclient"
                            schemaurl="/schema/domainform/45FC3D20-CDFB-455D-8499-BE9734C540D3/7F0B6A53-0EBB-4989-810C-014B112083E9/fa/ارتباط-با-کارشناسان"
                            displaymode="new" button="[data-btn-uploadfooter]" resultsourceid="upload.datafooter"
                            OnRendered="RenderFormFooter">
                        </basis>
                        <basis core="api" if="{##cms.uploadFooter.run|(false)##}" run="atclient"
                            url="/schema/domainform/45FC3D20-CDFB-455D-8499-BE9734C540D3/fa/editobject" method="post"
                            body="object_edit={##cms.uploadFooter.value##}&captcha={##cms.uploadFooter.captcha##}&captchaid={##cms.uploadFooter.captchaid##}"
                            content-type="application/x-www-form-urlencoded" triggers="cms.uploadFooter"
                            OnProcessed="OnProcessedEditObjectFooter">
                        </basis>
                        <basis core="callback" run="atclient" method="uploadDocumentFooter"
                            triggers="upload.datafooter"></basis>
                        <div class="captcha-button">
                            <div id="captchaContainer"
                                class="captchaContainerclass !w-full captcha-sefaresh ml-2.5 max-xl:ml-0 max-xl:mb-[20px]"
                                data-bc-answer-container data-bc-schema-info-multi="0" data-bc-schema-info-word="58"
                                data-bc-schema-info-part="1" data-bc-schema-info-part-0-type="text">
                                <basis core="dbsource" source="trust_login" name="captcha" run="atclient"
                                    triggers="captcha.refreshFooter">
                                    <member name="code" type="scalar" request="captcha"></member>
                                </basis>
                                <basis datamembername="captcha.code" core="print" run="atclient"
                                    OnRendered="captchaRenderedFooter">
                                    <face>
                                        <script type="text/template">
                                    <div class="flex  justify-between ">
                                        
                                        <div class="flex sfvgwdcsdhc w-full items-center">

                         <div class="float-right captcha-ctz w-1/2 relative">
                           
                            <input id="captcha-ct" type="text" class="contactUsInput codeinputm bg-white rounded-2xl p-3" name="captcha" maxlength="4" placeholder="کد امنیتی "/>
                            <input type="hidden" name="captchaid" value="@captcha@" />
                        </div>
                      <div class="float-right w-1/2 justify-between lg:mt-0 bvgvkek h-fit leading-[65px] px-4 flex items-center gap-2">
                       <img loading="lazy" src="/@captcha@" width="86" height="59" alt="captcha" />
                        <span  onclick="refreshCaptchaFooter()">
                            <svg class="group cursor-pointer" width="48" height="49" viewBox="0 0 48 49"
                                            fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path class="group-hover:stroke-primary"
                                                d="M25.7857 18.5L26.5807 20.5021C25.8273 20.0776 24.9442 19.8333 24 19.8333C21.2386 19.8333 19 21.9227 19 24.5C19 24.9149 19.058 25.3171 19.1669 25.7M22.2143 30.5L21.4193 28.4978C22.1727 28.9224 23.0558 29.1667 24 29.1667C26.7614 29.1667 29 27.0773 29 24.5C29 24.0851 28.942 23.6829 28.8331 23.3"
                                                stroke="#020121" stroke-width="1.5" stroke-linecap="round"
                                                stroke-linejoin="round" />
                                            <circle
                                                class="group-hover:stroke-primary transition-all duration-300 ease-in-out"
                                                cx="24" cy="24.5" r="10" stroke="#020121" stroke-width="1.5" />
                                        </svg>
                        </span>
                       
                    </div>

                                                        </div></div>
                    </script>
                                    </face>
                                </basis>
                                <button type="button" data-btn-uploadfooter
                                    class="text-sm  data-body-btn w-full h-12 flex justify-center items-center bg-secondary-600 rounded-lg hover:shadow-lg hover:bg-gradient-to-br hover:from-primary hover:to-primary-50">
                                    ارسال
                                </button>

                            </div>

                            <div
                                class="Loading_Form hidden data-body-btn h-12 px-4 py-2 rounded-2xl justify-center items-center gap-2.5 flex !w-full ">
                                <div id="ballsWaveG" class="ext-zinc-50 text-base font-normal leading-normal">
                                    <div id="ballsWaveG_1" class="ballsWaveG"></div>
                                    <div id="ballsWaveG_2" class="ballsWaveG"></div>
                                    <div id="ballsWaveG_3" class="ballsWaveG"></div>
                                    <div id="ballsWaveG_4" class="ballsWaveG"></div>
                                    <div id="ballsWaveG_5" class="ballsWaveG"></div>
                                    <div id="ballsWaveG_6" class="ballsWaveG"></div>
                                    <div id="ballsWaveG_7" class="ballsWaveG"></div>
                                    <div id="ballsWaveG_8" class="ballsWaveG"></div>
                                </div>
                            </div>
                            <div class="message-api text-center text-primary text-xs"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>


    </main>
    <basis core="call" file="footer.inc" pageindex="[##cms.cms.pageindex##]"></basis>
</body>
