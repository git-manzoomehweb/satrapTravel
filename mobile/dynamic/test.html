 <div class="office-item  w-full border border-zinc-300 rounded-lg  px-2">
      <div class="w-full flex items-center cursor-pointer justify-between h-[50px]">
        <div class="flex gap-2 ">
          <img loading="lazy" src="[##cms.cms.cdn##]/images/Pin-c.svg" alt="pin">
          <basis core="print" datamembername="db.office-view1">
            <face filter="TypeID=150">
              <p class="text-zinc-900 font-bold text-sm"> @text:</p>

            </face>
          </basis>
        </div>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <line x1="9" y1="1" x2="9" y2="17" stroke="#FFBD22" stroke-width="2" stroke-linecap="round" />
          <line x1="1" y1="9" x2="17" y2="9" stroke="#FFBD22" stroke-width="2" stroke-linecap="round" />
        </svg>

      </div>
      <div class="w-full show-info h-0 overflow-hidden">
        <div class="w-full flex flex-col gap-5 py-[15px] border-t border-zinc-300">
          <basis core="print" datamembername="db.office-view1">
            <face filter="Question in('آدرس')">
              <div class="flex items-center gap-2">
                <span class="border-l border-zinc-300 pl-2">
                  <img loading="lazy" src="[##cms.cms.cdn##]/images/Pin.svg" alt="pin" width="34" height="35">

                </span>
                <div class="text-zinc-900 w-[calc(100%-50px)]  text-xs text-justify pr-2">

                  @largetext
                </div>
              </div>
            </face>
          </basis>


          <basis core="print" datamembername="db.office-view1">
            <face filter="TypeID=240">
              <a href="tel:@text" class="flex items-center gap-2">
                <span class="border-l border-zinc-300 pl-2">
                  <img loading="lazy" src="[##cms.cms.cdn##]/images/Calling.svg" alt="Calling" width="34" height="35">

                </span>
                <div class="flex flex-col gap-2  text-xs  text-zinc-900 text-justify pr-2">
                  <div class="hover:text-primary  text-xs ">@text</div>
                </div>
              </a>
            </face>
          </basis>



          <basis core="print" datamembername="db.office-view1">
            <face filter="Question in('ایمیل')">
              <a href="mailto:@text" class="flex items-center gap-2">
                <span class="border-l border-zinc-300 pl-2">
                  <img loading="lazy" src="[##cms.cms.cdn##]/images/mailto-svg.svg" alt="mail" width="34" height="35">

                </span>
                <div class="flex  text-xs  flex-col gap-2 text-zinc-900 text-justify pr-2">
                  <p href="" class=" text-xs  hover:text-primary">@text</p>
                </div>
              </a>
            </face>
          </basis>


          <basis core="print" datamembername="db.office-view1">
            <face filter="TypeID=250">
              <iframe title="satrap" src="https://maps.google.com/maps?q=@largetext,@text&z=14&output=embed"
                class=" w-full rounded-xl align-middle !border-0 border-none" height="102" allowfullscreen=""
                loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </face>
          </basis>



        </div>

      </div>
    </div>
