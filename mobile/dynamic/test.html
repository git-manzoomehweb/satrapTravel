<div class="tourL-tour-card swiper-slide !h-[222px] group swiper-slide rounded-lg p-2 bg-[#FFBD22]">
          <span class="tourL-tour-airline hidden"
            data-airline-img="\@list.airline.pic">@db.last-minute-offer.prp_10000504</span>

          <a href="@db.last-minute-offer.link" class="h-[170px] w-full bg-white rounded-lg p-2 justify-between flex flex-col">
            <div class="w-full flex flex-col gap-[7px]">
              <h6 class="text-sm font-bold text-[#18181B] line-clamp-1">@db.last-minute-offer.title </h6>
              <div class="w-full mt-3 !text-[#18181B] flex flex-col gap-1">
                <div class="w-full flex  items-center justify-between">
                  <div class="flex items-center gap-1">
                    <img loading="lazy" src="[##cms.cms.cdn##]/images/Time Circle.svg" alt="time">
                    <p class="text-xs">مدت سفر</p>
                  </div>
                  <p class="text-xs"> @db.last-minute-offer.prp_8076 </p>
                </div>


                <div class="w-full flex  items-center justify-between">
                  <div class="flex items-center gap-1">
                    <img loading="lazy" src="[##cms.cms.cdn##]/images/plane up.svg" alt="planeup">
                    <p class="text-xs"> ایرلاین </p>
                  </div>
                  <img loading="lazy" src="@list.airline.pic" alt="@list.airline.name	" class="w-[57px]">
                </div>


                <div class="w-full flex  items-center justify-between">
                  <div class="flex items-center gap-1">
                    <img loading="lazy" src="[##cms.cms.cdn##]/images/Calendar.svg" alt="Calendar">
                    <p class="text-xs"> تاریخ سفر </p>
                  </div>
                  <p class="text-xs"> @db.last-minute-offer.prp_8077 </p>
                </div>

              </div>
            </div>
            <div class="w-full justify-between flex items-center">
              <p class="text-xs text-[#18181B]">شروع قیمت:</p>
              <p class="text-sm font-medium text-[#18181B]  tourL-tour-price">@db.last-minute-offer.prp_8181</p>
            </div>
          </a>
          <div class="w-full flex justify-between items-center h-[calc(100%-170px)]">
            <button onclick="toggleTourDateMenu(this, '@db.last-minute-offer.id')" type="button"
              class="tourL-tour-date-btn h-full px-4 bg-white rounded-lg text-xs date-btn flex justify-center items-center">تاریخ برگذاری</button>
            <a href="@db.last-minute-offer.link"
              class="text-center text-xs tetx-[#141414] transition-all ease-in-out duration-300">
              مشاهده</a>
          </div>
        </div>
