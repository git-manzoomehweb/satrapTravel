        function uploadDocument(args) {
            const captcha = document.querySelector("#captchaContainer input[name='captcha']").value;
            const captchaid = document.querySelector("#captchaContainer input[name='captchaid']").value;
            const stringJson = JSON.stringify(args.source?.rows[0]);
            $bc.setSource("cms.upload", {
                value: stringJson,
                captcha: captcha,
                captchaid: captchaid,
                run: true
            });
        };
        function refreshCaptcha(e) {
            $bc.setSource("captcha.refresh", true);
        };
        function captchaRendered() {
            document.querySelector(".contactUsInput").placeholder = "کد امنیتی";
        }
        async function OnProcessedEditObject(args) {
            var response = args.response;
            var json = await response.json();
            var errorid = json.errorid;
            if (errorid == "6") {
                document.querySelector(".message-api").innerHTML = "درخواست شما با موفقیت ثبت شد";
                document.querySelector(".message-api").style.color = "#34b343";
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
            } else {
                refreshCaptcha()
                setTimeout(() => {
                    document.querySelector(".message-api").innerHTML = "خطایی رخ داده, لطفا مجدد اقدام کنید";
                    document.querySelector(".message-api").style.color = "#ee2948";
                }, 2000);
            }

        }
        async function RenderVisaForm() {
            const visaName = document.querySelector('h1').innerText
            document.querySelector('.visa_name textarea').value = visaName

            document.querySelectorAll('[data-bc-question]:not(.Upload_QS)').forEach(container => {
                const titleSpan = container.querySelector('span[data-bc-question-title]');
                const input = container.querySelector('[data-bc-answer] input[data-bc-text-input]');

                if (titleSpan && input) {
                    const placeholderText = titleSpan.textContent.trim();
                    input.setAttribute('placeholder', placeholderText);
                }
            });

        }
